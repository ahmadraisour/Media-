<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:"El Messiri";src:url(fonts/ElMessiri.ttf);font-weight:400 700}
@font-face{font-family:"Plex";src:url(fonts/IBMPlexSansArabic-Bold.ttf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;
 background:radial-gradient(700px 900px at 22% 45%,#1d3a78 0%,rgba(29,58,120,0) 70%),linear-gradient(180deg,#0e2250,#0b1b3f 60%,#081530)}
.glow{position:absolute;left:-60px;top:520px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(245,197,66,.22),rgba(245,197,66,0) 65%)}
.p{position:absolute;left:-230px;bottom:-40px;height:1560px;filter:drop-shadow(0 0 40px rgba(0,0,0,.5)) brightness(1.12) contrast(1.04)}
.fade{position:absolute;left:0;right:0;bottom:0;height:420px;background:linear-gradient(180deg,rgba(8,21,48,0),#081530 85%)}
.txt{position:absolute;right:60px;width:520px;top:600px;font-family:"El Messiri";font-weight:700;color:#fff;font-size:76px;line-height:1.35;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.txt em{font-style:normal;color:#f5c542;display:block}
.bar{position:absolute;right:60px;width:120px;top:550px;height:8px;border-radius:8px;background:#f5c542;box-shadow:0 0 14px 3px rgba(245,197,66,.8)}
.line{position:absolute;left:60px;right:60px;top:1590px;height:7px;border-radius:7px;background:rgba(124,196,255,.18)}
.fill{position:absolute;right:60px;width:520px;top:1590px;height:7px;border-radius:7px;background:linear-gradient(270deg,#ffd84d,#f5c542 70%,#fff3b0);box-shadow:0 0 14px 3px rgba(245,197,66,.9)}
.dot{position:absolute;right:568px;top:1581px;width:25px;height:25px;border-radius:50%;background:#fff3b0;box-shadow:0 0 18px 7px rgba(245,197,66,.95)}
.name{position:absolute;right:60px;top:1625px;font-family:"Plex";font-weight:700;font-size:34px;color:#f5c542}
</style></head><body><div id="c"><div class="glow"></div><img class="p" src="person.png"><div class="fade"></div>
<div class="bar"></div><div class="txt" id="t"></div><div class="line"></div><div class="fill"></div><div class="dot"></div>
<div class="name">أحمد نديم ريسور</div></div>
<script>window.set=function(h){document.getElementById('t').innerHTML=h}</script></body></html>
