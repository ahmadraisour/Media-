<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:"El Messiri";src:url(fonts/ElMessiri.ttf);font-weight:400 700}
@font-face{font-family:"Plex";src:url(fonts/IBMPlexSansArabic-Bold.ttf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b1b3f}
#c{position:relative;width:1080px;height:1920px;overflow:hidden}
.ph{position:absolute;inset:0;background-size:cover;background-position:center top}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,27,63,0) 40%,rgba(11,27,63,.82) 62%,#0b1b3f 86%)}
.hook{position:absolute;right:80px;left:80px;top:1130px;font-family:"El Messiri";font-weight:700;color:#fff;font-size:92px;line-height:1.3;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.hook em{font-style:normal;color:#f5c542}
.line{position:absolute;left:80px;right:80px;top:1560px;height:7px;border-radius:7px;background:rgba(124,196,255,.18)}
.fill{position:absolute;left:80px;width:560px;top:1560px;height:7px;border-radius:7px;background:linear-gradient(90deg,#ffd84d,#f5c542 70%,#fff3b0);box-shadow:0 0 14px 3px rgba(245,197,66,.9)}
.dot{position:absolute;left:628px;top:1551px;width:25px;height:25px;border-radius:50%;background:#fff3b0;box-shadow:0 0 18px 7px rgba(245,197,66,.95)}
.name{position:absolute;right:80px;top:1595px;font-family:"Plex";font-weight:700;font-size:34px;color:#f5c542}
.safe{position:absolute;left:0;right:0;border-top:3px dashed #ff4d6d;opacity:0}
</style></head><body><div id="c"><div class="ph" id="ph"></div><div class="sh"></div>
<div class="hook" id="hk"></div><div class="line"></div><div class="fill"></div><div class="dot"></div>
<div class="name">أحمد نديم ريسور</div></div>
<script>window.set=function(img,h){document.getElementById('ph').style.backgroundImage='url('+img+')';document.getElementById('hk').innerHTML=h}</script>
</body></html>
