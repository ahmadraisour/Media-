<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"El Messiri";src:url(fonts/ElMessiri.ttf);font-weight:400 700}
html,body{margin:0;width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 40%,#16306a,#0b1b3f 70%);overflow:hidden}
svg{position:absolute;left:0;top:0}
.lb{position:absolute;font-family:"El Messiri";font-weight:700;font-size:46px;padding:4px 26px;border-radius:999px;transform:translate(-50%,0)}
#ls{color:#0b1b3f;background:#7cc4ff}
#le{color:#0b1b3f;background:#5dffa5;box-shadow:0 0 24px 4px rgba(93,255,165,.6)}
</style></head><body>
<svg id="g" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<div class="lb" id="ls">البداية</div><div class="lb" id="le">النهاية</div>
<script>
var C=9,R=10,S=100,ox=(1080-C*S)/2,oy=370;
var seed=parseInt(location.hash.slice(1)||"13");function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
var cells=[];for(var y=0;y<R;y++){cells.push([]);for(var x=0;x<C;x++)cells[y].push({v:0,w:[1,1,1,1]})}
var D=[[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]];
cells[0][0].v=1;var fr=[];function addF(x,y){D.forEach(function(d){var nx=x+d[0],ny=y+d[1];if(nx>=0&&ny>=0&&nx<C&&ny<R&&!cells[ny][nx].v)fr.push([x,y,d])})}
addF(0,0);while(fr.length){var i=Math.floor(rnd()*fr.length),f=fr.splice(i,1)[0],x=f[0],y=f[1],d=f[2],nx=x+d[0],ny=y+d[1];if(cells[ny][nx].v)continue;
 cells[y][x].w[d[2]]=0;cells[ny][nx].w[d[3]]=0;cells[ny][nx].v=1;addF(nx,ny)}
function nb(x,y){var r=[];D.forEach(function(d){if(!cells[y][x].w[d[2]])r.push([x+d[0],y+d[1]])});return r}
// BFS tree from start
var par={'0,0':null},q=[[0,0]],order=[];
while(q.length){var c=q.shift();order.push(c);nb(c[0],c[1]).forEach(function(n){var k=n[0]+','+n[1];if(!(k in par)){par[k]=c;q.push(n)}})}
function pathTo(x,y){var p=[[x,y]],k=x+','+y;while(par[k]){var a=par[k];p.push(a);k=a[0]+','+a[1]}return p.reverse()}
var sol=pathTo(C-1,R-1); var onSol={};sol.forEach(function(p){onSol[p[0]+','+p[1]]=1});
// dead ends not on solution, choose 3 with moderate length, diverse
var dead=[];for(var y=0;y<R;y++)for(var x=0;x<C;x++){if(onSol[x+','+y])continue;if(nb(x,y).length==1){var p=pathTo(x,y);if(p.length>=5&&p.length<=13)dead.push(p)}}
dead.sort(function(a,b){return a.length-b.length});
var picks=[],used={};dead.forEach(function(p){var key=p.slice(0,Math.min(p.length,4)).map(String).join('|');var br=null;for(var i=0;i<p.length;i++){if(!onSol[p[i][0]+','+p[i][1]]){br=p[i-1]+'';break}}if(picks.length<3&&!used[br]){used[br]=1;picks.push(p)}});
function P(c){return [ox+c[0]*S+S/2,oy+c[1]*S+S/2]}
function dstr(p){return 'M'+p.map(function(c){return P(c).join(' ')}).join(' L')}
var walls='';for(var y=0;y<R;y++)for(var x=0;x<C;x++){var w=cells[y][x].w,X=ox+x*S,Y=oy+y*S;
 if(w[0]&&!(x==0&&y==0))walls+='<line x1="'+X+'" y1="'+Y+'" x2="'+(X+S)+'" y2="'+Y+'"/>';
 if(w[3])walls+='<line x1="'+X+'" y1="'+Y+'" x2="'+X+'" y2="'+(Y+S)+'"/>';
 if(y==R-1&&w[2]&&!(x==C-1))walls+='<line x1="'+X+'" y1="'+(Y+S)+'" x2="'+(X+S)+'" y2="'+(Y+S)+'"/>';
 if(x==C-1&&w[1])walls+='<line x1="'+(X+S)+'" y1="'+Y+'" x2="'+(X+S)+'" y2="'+(Y+S)+'"/>';}
var rev=sol.slice().reverse();
var h='<defs><filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
h+='<g stroke="rgba(124,196,255,.7)" stroke-width="10" stroke-linecap="round">'+walls+'</g>';
picks.forEach(function(p,i){var e=P(p[p.length-1]),pr=P(p[p.length-2]),dx=Math.sign(e[0]-pr[0]),dy=Math.sign(e[1]-pr[1]),wx=e[0]+dx*S/2,wy=e[1]+dy*S/2,hx=dy?S/2:0,hy=dx?S/2:0;
 h+='<line class="bar" x1="'+(wx-hx)+'" y1="'+(wy-hy)+'" x2="'+(wx+hx)+'" y2="'+(wy+hy)+'" stroke="#ff4d55" stroke-width="18" stroke-linecap="round" opacity="0" style="filter:drop-shadow(0 0 10px #ff4d55)"/>';h+='<path class="red" d="'+dstr(p)+'" fill="none" stroke="#e5484d" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>'+
 '<g class="x" transform="translate('+e[0]+' '+e[1]+')" opacity="0"><line x1="-22" y1="-22" x2="22" y2="22" stroke="#ff6b70" stroke-width="12" stroke-linecap="round"/><line x1="22" y1="-22" x2="-22" y2="22" stroke="#ff6b70" stroke-width="12" stroke-linecap="round"/></g>'});
h+='<path id="gp" d="'+dstr(rev)+'" fill="none" stroke="#5dffa5" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/>';
h+='<circle id="hd" r="22" fill="#eafff3" filter="url(#gl)"/>';
var s0=P([0,0]),e0=P([C-1,R-1]);
h+='<circle cx="'+s0[0]+'" cy="'+s0[1]+'" r="24" fill="none" stroke="#7cc4ff" stroke-width="7"/><circle cx="'+e0[0]+'" cy="'+e0[1]+'" r="30" fill="#5dffa5" filter="url(#gl)"/>';
document.getElementById('g').innerHTML='<g transform="translate(0 '+(2*oy+R*S)+') scale(1 -1)">'+h+'</g>';
var ls=document.getElementById('ls'),le=document.getElementById('le');
ls.style.left=s0[0]+'px';ls.style.top=(oy+R*S+22)+'px';le.style.left=e0[0]+'px';le.style.top=(oy-86)+'px';
var reds=[].slice.call(document.querySelectorAll('.red')),xs=[].slice.call(document.querySelectorAll('.x')),bars=[].slice.call(document.querySelectorAll('.bar'));
reds.forEach(function(r){var L=r.getTotalLength();r._L=L;r.style.strokeDasharray=L;r.style.strokeDashoffset=L});
var G=document.getElementById('gp'),GL=G.getTotalLength();G.style.strokeDasharray=GL;
function cl(v){return Math.max(0,Math.min(1,v))}
window.frame=function(t){
 reds.forEach(function(r,i){var a=0.05+i*0.18,k=cl((t-a)/0.5);k=1-Math.pow(1-k,2);r.style.strokeDashoffset=r._L*(1-k);
   var xo=cl((t-a-0.5)/0.12);xs[i].setAttribute('opacity',xo);bars[i].setAttribute('opacity',xo);
   r.setAttribute('opacity',t>1.6?Math.max(0.35,1-(t-1.6)*1.5):0.95)});
 var k=cl((t-0.95)/1.25);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;G.style.strokeDashoffset=GL*(1-k);
 var q=G.getPointAtLength(GL*k),hd=document.getElementById('hd');hd.setAttribute('cx',q.x);hd.setAttribute('cy',q.y);hd.setAttribute('opacity',t<0.95?0:1);
};
frame(0);
</script></body></html>
