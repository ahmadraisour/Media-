<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:"El Messiri";src:url(fonts/ElMessiri.ttf);font-weight:400 700}
@font-face{font-family:"Plex";src:url(fonts/IBMPlexSansArabic-Bold.ttf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
#s{position:relative;width:1080px;height:1920px;overflow:hidden}
.scene{position:absolute;inset:0;overflow:hidden;opacity:0}
.scene img.ph{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;transform-origin:50% 50%}
.scene .shade{position:absolute;inset:0;background:radial-gradient(ellipse 90% 22% at 50% 47%,rgba(6,14,34,.72) 0%,rgba(6,14,34,.35) 60%,rgba(6,14,34,0) 100%),linear-gradient(180deg,rgba(6,14,34,.1),rgba(6,14,34,.25))}
.mg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,#1d3c7e 0%,#0b1b3f 55%,#050d22 100%)}
.ring{position:absolute;left:50%;top:900px;width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;
 background:radial-gradient(circle at 50% 40%,#ffe08a 0%,#f5c542 50%,#c99318 100%);box-shadow:0 0 110px 30px rgba(245,197,66,.35),0 0 0 18px rgba(245,197,66,.12),0 0 0 40px rgba(245,197,66,.06)}
.cut{position:absolute;left:50%;bottom:-120px;height:1520px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6));transform-origin:50% 100%}
.dust{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(5,13,34,.9),rgba(5,13,34,0) 45%)}
.kt{position:absolute;left:40px;right:40px;text-align:center;font-family:"El Messiri";font-weight:700}
.kt .sm{display:block;font-size:66px;line-height:1.3;color:#f5c542;text-shadow:0 3px 14px rgba(0,0,0,.85)}
.kt .sm span{display:inline-block;margin:0 9px}
.kt .bg{display:block;font-size:128px;line-height:1.25;color:#fff;text-shadow:0 4px 22px rgba(0,0,0,.9),0 0 2px #000;white-space:nowrap}
.sub{position:absolute;left:50px;right:50px;top:1180px;text-align:center;font-family:"El Messiri";font-weight:700;font-size:72px;line-height:1.35;color:#fff;
 text-shadow:0 0 8px #000,0 4px 16px rgba(0,0,0,.95),0 0 2px #000}
.sub span{display:inline-block;margin:0 8px}
.sub span.on{color:#f5c542}
.pop{position:absolute;left:0;right:0;text-align:center}
.pop b{display:inline-block;font-family:"El Messiri";font-weight:700;font-size:92px;color:#1a1405;background:#f5c542;border-radius:28px;padding:6px 44px;box-shadow:0 0 40px 8px rgba(245,197,66,.55)}
.flash{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at 50% 45%,rgba(245,197,66,0) 30%,rgba(245,197,66,.55) 100%)}
.track{position:absolute;left:70px;right:70px;top:1735px;height:8px;border-radius:8px;background:rgba(255,255,255,.18)}
.fill{position:absolute;left:70px;top:1735px;height:8px;border-radius:8px;background:linear-gradient(90deg,#ffd84d,#f5c542 70%,#fff3b0);box-shadow:0 0 14px 3px rgba(245,197,66,.9)}
.head{position:absolute;top:1739px;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff3b0;box-shadow:0 0 18px 7px rgba(245,197,66,.95)}
.name{position:absolute;right:70px;top:1765px;font-family:"Plex";font-weight:700;font-size:34px;color:#f5c542;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.cam{position:absolute;left:0;top:0;width:1080px;height:1920px}
.lay{position:absolute;left:0;top:0;width:1080px;height:1920px}
.sp{position:absolute;left:0;top:0}
canvas.pc{position:absolute;left:0;top:0}
.leak{position:absolute;inset:0;mix-blend-mode:screen}
.tsh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,14,34,.8) 0%,rgba(6,14,34,.45) 28%,rgba(6,14,34,0) 45%)}
.vig{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 35%,rgba(0,0,0,.85) 100%)}
</style></head><body><div id="s">
<div id="scenes"></div>
<div class="flash" id="flash"></div>
<div class="kt" id="kt"></div>
<div class="sub" id="sub"></div><div class="pop" id="pop"><b id="popb"></b></div>
<div class="track"></div><div class="fill" id="fill"></div><div class="head" id="head"></div><div class="name">أحمد نديم ريسور</div></div>
<script>
var NOJOIN='اأإآدذرزوؤةىء';
function kash(w,k){if(k<=0)return w;var o='';for(var i=0;i<w.length;i++){o+=w[i];var c=w[i],n=w[i+1];
 if(n&&/[ء-ي]/.test(c)&&/[ء-ي]/.test(n)&&NOJOIN.indexOf(c)<0){for(var j=0;j<k;j++)o+='ـ'}}return o}
function ease(x){x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)}
function cl(v){return Math.max(0,Math.min(1,v))}function eio(k){k=cl(k);return k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2}function eo(k){k=cl(k);return 1-Math.pow(1-k,3)}
function shake(t,t0,dur,amp,f){if(t<t0||t>t0+dur)return[0,0];var k=(t-t0)/dur,A=amp*(1-k);return[A*Math.sin(t*f),A*Math.cos(t*f*0.83)]}
</script>
<script src="scenes.js"></script>
<script>
// المحرك العام: الإعدادات كلها من project.json (init(cfg, subs))
var D=null,CFG=null,DUR=0,SC=[],POPS=[],FL=[],SUBTOP=[],EL=[];
window.init=function(cfg,d){CFG=cfg;D=d;DUR=cfg.dur;POPS=cfg.pops||[];FL=cfg.flash||[];SUBTOP=cfg.subTop||[];
 SC=(cfg.scenes||[]).map(function(s){var o={};for(var k in s)o[k]=s[k];o.len=v(s.len,s.b-s.a);o.beats=s.beats||[];return o});
 if(cfg.name===false)document.querySelector('.name').style.display='none';
 var h='';SC.forEach(function(s,i){h+='<div class="scene" id="sc'+i+'" style="display:none">'+TPL[s.type](s)+'</div>'});document.getElementById('scenes').innerHTML=h;
 EL=SC.map(function(s,i){return document.getElementById('sc'+i)});};
window.ready=function(){return Promise.all([].slice.call(document.images).map(function(im){return im.decode().catch(function(){})}))};
window.frame=function(t){
 var W=D.words, inScene=-1;
 SC.forEach(function(s,i){var el=EL[i];var a=s.a,b=s.b;
   if(t<a-0.01||t>b+0.25){el.style.opacity=0;el.style.display='none';return}
   el.style.display='';var e=ease((t-a)/0.25),o=Math.min(1,Math.max(0,(b+0.2-t)/0.25));var op=Math.min(e,o);el.style.opacity=op;
   el.style.filter='blur('+((1-op)*24).toFixed(1)+'px)';if(t>=a&&t<b)inScene=i;UPD[s.type](el,Math.max(0,t-a),t,s);
 });
 // الكتابة المتحركة
 var kt=document.getElementById('kt'),html='',top=820;
 if(inScene>=0){var s=SC[inScene];top=v(s.kt,v(KT_TOP[s.type],760));
   for(var j=0;j<s.beats.length;j++){var B=s.beats[j];if(t>=B[0]&&t<B[1]){
     html='<span class="sm">';B[2].forEach(function(ix){var w=W[ix];var e=ease((t-w[0])/0.22);
       html+='<span style="opacity:'+e+';filter:blur('+((1-e)*10).toFixed(1)+'px);transform:translateY('+(14*(1-e))+'px)">'+w[2]+'</span>'});
     html+='</span>';
     var bw=B[3].map(function(ix){return W[ix]}),t0=bw[0][0],e=ease((t-t0)/0.3);
     var k=Math.round(ease((t-t0)/0.45)*3);var txt=bw.filter(function(w){return t>=w[0]-0.05}).map(function(w){return kash(w[2],k)}).join('<br>');
     html+='<span class="bg" style="opacity:'+(t>=t0-0.05?e:0)+';filter:blur('+((1-e)*16).toFixed(1)+'px);transform:scale('+(1.15-0.15*e)+')">'+(txt||'&nbsp;')+'</span>';
     var fo=Math.min(1,(B[1]-t)/0.15);kt.style.opacity=fo;break;}}}
 kt.style.top=top+'px';kt.innerHTML=html;if(!html)kt.style.opacity=0;
 var bgE=kt.querySelector('.bg');if(bgE){var sw=bgE.scrollWidth,mw=1000;if(sw>mw){bgE.style.fontSize=Math.floor(128*mw/sw)+'px'}}
 // الترجمة (بس على وجه أحمد)
 var sub=document.getElementById('sub'),sh='',C=D.chunks,act=-1;
 if(inScene<0){for(var c=0;c<C.length;c++){var a=W[C[c][0]][0],b=(c+1<C.length?W[C[c+1][0]][0]:DUR);if(t>=a&&t<b){act=c;break}}}
 if(act>=0){var ws=C[act],a0=W[ws[0]][0];ws.forEach(function(ix){var w=W[ix];sh+='<span class="'+(t>=w[0]?'on':'')+'">'+w[2]+'</span>'});
   var p=ease((t-a0)/0.15);sub.style.opacity=p;sub.style.transform='scale('+(0.92+0.08*p)+')';}
 var st=1180;SUBTOP.forEach(function(r){if(t>=r[0]&&t<r[1])st=r[2]});sub.style.top=st+'px';sub.innerHTML=sh;
 // البطاقات
 var pop=document.getElementById('pop'),pb=document.getElementById('popb'),shown=false;
 POPS.forEach(function(P){if(t>=P[0]&&t<P[1]){shown=true;pb.textContent=P[2];pop.style.top=P[3]+'px';
   var e=ease((t-P[0])/0.25),o=Math.min(1,(P[1]-t)/0.2);pop.style.opacity=Math.min(e,o);pb.style.transform='scale('+(0.6+0.4*e)+') rotate('+(-3+3*e)+'deg)';}});
 if(!shown)pop.style.opacity=0;
 // الومضة
 var fv=0;FL.forEach(function(f){var d=t-f;if(d>=0&&d<0.45)fv=Math.max(fv,d<0.08?d/0.08:1-(d-0.08)/0.37)});document.getElementById('flash').style.opacity=fv;
 var x0=70,x1=1010,x=x0+(x1-x0)*Math.min(1,t/DUR);document.getElementById('fill').style.width=(x-x0)+'px';document.getElementById('head').style.left=x+'px';
};
</script></body></html>
