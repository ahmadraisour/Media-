<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:"El Messiri";src:url(fonts/ElMessiri.ttf);font-weight:400 700}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 1000px}
.lay{position:absolute;left:0;top:0;width:1080px;height:1920px}
#bg{filter:blur(1.6px)}
svg{position:absolute;left:0;top:0}
#leak{position:absolute;inset:0;mix-blend-mode:screen;opacity:.0}
canvas{position:absolute;left:0;top:0}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse 90% 22% at 50% 47%,rgba(6,14,34,.62) 0%,rgba(6,14,34,.3) 60%,rgba(6,14,34,0) 100%)}
.kt{position:absolute;left:40px;right:40px;top:760px;text-align:center;font-family:"El Messiri";font-weight:700}
.sm{display:block;font-size:66px;line-height:1.3;color:#f5c542;text-shadow:0 3px 14px rgba(0,0,0,.85)}
.sm span{display:inline-block;margin:0 9px}
.bgt{display:block;font-size:128px;line-height:1.25;color:#fff;text-shadow:0 4px 22px rgba(0,0,0,.9);white-space:nowrap}
</style></head><body>
<div id="cam">
 <div class="lay" id="bgw"><img id="bg" class="lay" src="kid_bg.jpg">
  <svg width="1080" height="1920"><path id="ln" d="M578 1063 L652 1087 L637 1152 L722 1177 L737 1127" fill="none" stroke="#2a2a33" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <g id="x" opacity="0" transform="translate(737 1127) scale(1.5)"><line x1="-18" y1="-18" x2="18" y2="18" stroke="#e5484d" stroke-width="9" stroke-linecap="round"/><line x1="18" y1="-18" x2="-18" y2="18" stroke="#e5484d" stroke-width="9" stroke-linecap="round"/></g></svg>
 </div>
 <img id="hand" class="lay" src="hand.png">
</div>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="leak"></div><div class="shade"></div>
<div class="kt" id="kt"></div>
<script>
var L=document.getElementById('ln'),LL=L.getTotalLength();L.style.strokeDasharray=LL;
var P0={x:578,y:1063};
function cl(v){return Math.max(0,Math.min(1,v))}function eio(k){k=cl(k);return k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2}function eo(k){k=cl(k);return 1-Math.pow(1-k,3)}
var seed=3;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
var dots=[];for(var i=0;i<46;i++)dots.push({x:rnd()*1080,y:rnd()*1920,r:1.5+rnd()*4,s:10+rnd()*30,a:.15+rnd()*.45,ph:rnd()*6});
var NJ='اأإآدذرزوؤةىء';function kash(w,k){var o='';for(var i=0;i<w.length;i++){o+=w[i];var c=w[i],n=w[i+1];if(k>0&&n&&/[ء-ي]/.test(c)&&/[ء-ي]/.test(n)&&NJ.indexOf(c)<0)for(var j=0;j<k;j++)o+='ـ'}return o}
var BE=[[0,1.03,[['وقت',0],['كنت',0.48]],['صغير',0.72]],[1.03,3.3,[['كنت',1.03],['تلعب',1.28]],['بهالمتاهة',1.6]]];
window.frame=function(t){
 var p=eio(t/3.3);
 // line + hand follow
 var d=eio((t-0.25)/1.75),len=LL*d;L.style.strokeDashoffset=LL-len;var q=L.getPointAtLength(len);
 var hx=q.x-P0.x,hy=q.y-P0.y,lift=eo((t-2.15)/0.5);hx+=-30*lift;hy+=-55*lift;
 document.getElementById('hand').style.transform='translate('+hx+'px,'+hy+'px) scale('+(1+0.025*lift)+')';
 document.getElementById('x').setAttribute('opacity',eo((t-2.0)/0.12));
 // camera
 var sx=0,sy=0;if(t>2.0&&t<2.3){var k=(t-2.0)/0.3;var amp=14*(1-k);sx=amp*Math.sin(t*95);sy=amp*Math.cos(t*80)}
 var z=1.06+0.14*p,r=-1.4+2.2*p,tx=-20+40*p+sx,ty=30-70*p+sy;
 document.getElementById('cam').style.transform='translate('+tx+'px,'+ty+'px) rotate('+r+'deg) scale('+z+')';
 document.getElementById('bgw').style.transform='scale('+(1-0.03*p)+')';
 // particles
 var c=document.getElementById('cv').getContext('2d');c.clearRect(0,0,1080,1920);
 dots.forEach(function(o){var y=(o.y-o.s*t*2+1920)%1920,x=o.x+12*Math.sin(t*1.3+o.ph);c.beginPath();c.arc(x,y,o.r,0,7);c.fillStyle='rgba(255,220,150,'+(o.a*(0.6+0.4*Math.sin(t*3+o.ph)))+')';c.fill()});
 var lk=document.getElementById('leak');var lp=-40+140*p;lk.style.background='radial-gradient(ellipse 60% 40% at '+lp+'% 18%,rgba(255,170,60,.55),rgba(255,170,60,0) 70%)';lk.style.opacity=.9;
 document.body.style.filter='blur('+((1-eo(t/0.25))*20).toFixed(1)+'px)';
 // text
 var h='';BE.forEach(function(B){if(t>=B[0]&&t<B[1]){h='<span class="sm">';B[2].forEach(function(w){var e=eo((t-w[1])/0.22);h+='<span style="opacity:'+e+';filter:blur('+((1-e)*10)+'px);transform:translateY('+(14*(1-e))+'px)">'+w[0]+'</span>'});h+='</span>';
   var e=eo((t-B[3][1])/0.3),k=Math.round(eo((t-B[3][1])/0.45)*3);h+='<span class="bgt" style="opacity:'+(t>=B[3][1]?e:0)+';filter:blur('+((1-e)*16)+'px);transform:scale('+(1.15-0.15*e)+')">'+kash(B[3][0],k)+'</span>'}});
 document.getElementById('kt').innerHTML=h;
};frame(0);
</script></body></html>
