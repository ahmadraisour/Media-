<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:"El Messiri";src:url(fonts/ElMessiri.ttf);font-weight:400 700}
@font-face{font-family:"Plex";src:url(fonts/IBMPlexSansArabic-Bold.ttf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
#s{position:relative;width:1080px;height:1920px}
.hook{position:absolute;left:70px;right:70px;top:210px;text-align:center;font-family:"El Messiri";font-weight:700;color:#fff;font-size:86px;line-height:1.3;
 background:rgba(11,27,63,.82);border:3px solid rgba(245,197,66,.8);border-radius:34px;padding:26px 30px;box-shadow:0 0 40px rgba(245,197,66,.35)}
.hook em{font-style:normal;color:#f5c542;display:block}
.sub{position:absolute;left:60px;right:60px;top:1290px;text-align:center;font-family:"El Messiri";font-weight:700;font-size:78px;line-height:1.35;color:#fff;
 text-shadow:0 0 6px #000,0 4px 14px rgba(0,0,0,.9),0 0 2px #000}
.sub .in{display:inline-block;background:rgba(8,18,40,.55);border-radius:22px;padding:4px 18px}
.sub span{display:inline-block;margin:0 8px;transition:none}
.sub span.on{color:#f5c542}
.pop{position:absolute;left:0;right:0;top:1060px;text-align:center}
.pop b{display:inline-block;font-family:"El Messiri";font-weight:700;font-size:96px;color:#1a1405;background:#f5c542;border-radius:28px;padding:6px 44px;
 box-shadow:0 0 40px 8px rgba(245,197,66,.55)}
.track{position:absolute;left:70px;right:70px;top:1735px;height:8px;border-radius:8px;background:rgba(255,255,255,.18)}
.fill{position:absolute;left:70px;top:1735px;height:8px;border-radius:8px;background:linear-gradient(90deg,#ffd84d,#f5c542 70%,#fff3b0);box-shadow:0 0 14px 3px rgba(245,197,66,.9)}
.head{position:absolute;top:1739px;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff3b0;box-shadow:0 0 18px 7px rgba(245,197,66,.95)}
.name{position:absolute;right:70px;top:1765px;font-family:"Plex";font-weight:700;font-size:34px;color:#f5c542;text-shadow:0 2px 8px rgba(0,0,0,.8)}
</style></head><body><div id="s">
<div class="hook" id="hook">هاي مو متاهة…<em>هاي حياتك إنت</em></div>
<div class="sub" id="sub"></div><div class="pop" id="pop"><b id="popb"></b></div>
<div class="track"></div><div class="fill" id="fill"></div><div class="head" id="head"></div><div class="name">أحمد نديم ريسور</div></div>
<script>
var D=null, DUR=52.43;
var POPS=[[13.3,15.3,'بالعكس ↺'],[38.4,40.9,'حلّها من النهاية'],[46.9,50.6,'اكتب: خريطة 👇🏻'],[50.7,52.43,'مجاني 100%']];
function ease(x){x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)}
window.init=function(d){D=d};
window.frame=function(t){
 var h=document.getElementById('hook');
 var hi=ease((t-0.05)/0.35), ho=t>3.0?Math.max(0,1-(t-3.0)/0.3):1;
 h.style.opacity=hi*ho; h.style.transform='scale('+(0.85+0.15*hi)+')';
 // subtitles
 var sub=document.getElementById('sub'), html='', W=D.words, C=D.chunks, act=-1;
 for(var c=0;c<C.length;c++){var a=W[C[c][0]][0], b=(c+1<C.length?W[C[c+1][0]][0]:DUR); if(t>=a&&t<b){act=c;break}}
 var hidePop=false;
 if(act>=0){ var ws=C[act]; var a0=W[ws[0]][0];
   for(var k=0;k<ws.length;k++){var w=W[ws[k]]; var on=(t>=w[0]); html+='<span class="'+(on?'on':'')+'">'+w[2]+'</span>'}
   var p=ease((t-a0)/0.15); sub.style.transform='scale('+(0.9+0.1*p)+')'; sub.style.opacity=p;}
 sub.innerHTML=html?'<div class="in">'+html+'</div>':'';
 // pops
 var pop=document.getElementById('pop'), pb=document.getElementById('popb'), shown=false;
 for(var i=0;i<POPS.length;i++){var P=POPS[i]; if(t>=P[0]&&t<P[1]){shown=true; pb.textContent=P[2];
   var e=ease((t-P[0])/0.25), o=Math.min(1,(P[1]-t)/0.2); pop.style.opacity=Math.min(e,o); pb.style.transform='scale('+(0.6+0.4*e)+') rotate('+(-3+3*e)+'deg)';}}
 if(!shown) pop.style.opacity=0;
 // progress
 var x0=70, x1=1010, x=x0+(x1-x0)*Math.min(1,t/DUR);
 document.getElementById('fill').style.width=(x-x0)+'px'; document.getElementById('head').style.left=x+'px';
};
</script></body></html>
