<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;background:#0b1b3f;overflow:hidden}
svg{position:absolute;left:0;top:0}
</style></head><body>
<svg id="g" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// generate a perfect maze (DFS) with fixed seed
var C=9,R=13,S=100,ox=(1080-C*S)/2,oy=(1920-R*S)/2;
var seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
var cells=[];for(var y=0;y<R;y++){cells.push([]);for(var x=0;x<C;x++)cells[y].push({v:0,w:[1,1,1,1]})}
var st=[[0,0]];cells[0][0].v=1;var D=[[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]];
while(st.length){var c=st[st.length-1],x=c[0],y=c[1],n=[];D.forEach(function(d){var nx=x+d[0],ny=y+d[1];if(nx>=0&&ny>=0&&nx<C&&ny<R&&!cells[ny][nx].v)n.push(d)});
 if(!n.length){st.pop();continue}var d=n[Math.floor(rnd()*n.length)];cells[y][x].w[d[2]]=0;cells[y+d[1]][x+d[0]].w[d[3]]=0;cells[y+d[1]][x+d[0]].v=1;st.push([x+d[0],y+d[1]])}
// solve from end (C-1,R-1) to start (0,0) BFS
var prev={},q=[[C-1,R-1]],seen={};seen[(C-1)+','+(R-1)]=1;
while(q.length){var c=q.shift();if(c[0]==0&&c[1]==0)break;D.forEach(function(d,i){if(cells[c[1]][c[0]].w[d[2]])return;var k=(c[0]+d[0])+','+(c[1]+d[1]);if(!seen[k]){seen[k]=1;prev[k]=c;q.push([c[0]+d[0],c[1]+d[1]])}})}
var path=[[0,0]];var k='0,0';while(prev[k]){var p=prev[k];path.push(p);k=p[0]+','+p[1]}
// path currently start->end; we draw end->start
path.reverse();
var svg='';for(var y=0;y<R;y++)for(var x=0;x<C;x++){var w=cells[y][x].w,X=ox+x*S,Y=oy+y*S;
 if(w[0])svg+='<line x1="'+X+'" y1="'+Y+'" x2="'+(X+S)+'" y2="'+Y+'"/>';
 if(w[3])svg+='<line x1="'+X+'" y1="'+Y+'" x2="'+X+'" y2="'+(Y+S)+'"/>';
 if(y==R-1&&w[2])svg+='<line x1="'+X+'" y1="'+(Y+S)+'" x2="'+(X+S)+'" y2="'+(Y+S)+'"/>';
 if(x==C-1&&w[1])svg+='<line x1="'+(X+S)+'" y1="'+Y+'" x2="'+(X+S)+'" y2="'+(Y+S)+'"/>';}
var pts=path.map(function(p){return [ox+p[0]*S+S/2,oy+p[1]*S+S/2]});
var d='M'+pts.map(function(p){return p.join(' ')}).join(' L');
document.getElementById('g').innerHTML='<defs><filter id="gl"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'+
 '<g stroke="rgba(124,196,255,.55)" stroke-width="10" stroke-linecap="round">'+svg+'</g>'+
 '<path id="p" d="'+d+'" fill="none" stroke="#f5c542" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/>'+
 '<circle id="h" r="20" fill="#fff3b0" filter="url(#gl)"/>'+
 '<circle cx="'+pts[0][0]+'" cy="'+pts[0][1]+'" r="30" fill="#5dffa5" filter="url(#gl)"/>'+
 '<circle cx="'+pts[pts.length-1][0]+'" cy="'+pts[pts.length-1][1]+'" r="26" fill="none" stroke="#f5c542" stroke-width="6"/>';
var P=document.getElementById('p'),L=P.getTotalLength();P.style.strokeDasharray=L;
window.frame=function(t){var k=Math.max(0,Math.min(1,t/1.0));k=1-Math.pow(1-k,2);P.style.strokeDashoffset=L*(1-k);var q=P.getPointAtLength(L*k);var h=document.getElementById('h');h.setAttribute('cx',q.x);h.setAttribute('cy',q.y);
 document.getElementById('g').style.transform='scale('+(1+0.06*t)+')';};
</script></body></html>
